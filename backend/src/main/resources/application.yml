spring:
  application:
    name: online-banking
  datasource:
    url: jdbc:h2:file:./data/banking
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

app:
  jwt-secret: ${APP_JWT_SECRET:solo-para-desarrollo-cambiame-0123456789abcdef}
  jwt-ttl-minutes: 30
  quote-ttl-seconds: 120
  admin-email: admin@ceiba.demo
  admin-password: ${APP_ADMIN_PASSWORD:Admin123!}
  frontend-url: http://localhost:5173
  dev-outbox: true
